imports:
    - { resource: parameters.yaml }

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $appSecret: '%kernel.secret%'
            bool $kernelDebug: '%kernel.debug%'
            string $ollamaBaseUrl: '%env(OLLAMA_BASE_URL)%'
            string $ollamaModel: '%env(OLLAMA_MODEL)%'
            string $ollamaKeepAlive: '%env(OLLAMA_KEEP_ALIVE)%'
            int $ollamaNumCtx: '%env(int:OLLAMA_NUM_CTX)%'
            int $ollamaMaxTokens: '%env(int:OLLAMA_MAX_TOKENS)%'
            int $ollamaMaxHistory: '%env(int:OLLAMA_MAX_HISTORY)%'
            int $ollamaMaxMessageChars: '%env(int:OLLAMA_MAX_MESSAGE_CHARS)%'
            int $ollamaNumThreads: '%env(int:OLLAMA_NUM_THREADS)%'
            int $ollamaTimeout: '%env(int:OLLAMA_TIMEOUT)%'
            array $ollamaAllowedModels: '%env(csv:OLLAMA_ALLOWED_MODELS)%'
            string $mailerFrom: '%env(MAILER_FROM)%'
            string $publicBaseUrl: '%env(APP_PUBLIC_URL)%'
            string $rootDomain: '%env(ROOT_DOMAIN)%'
            'bool $globalEnabled': '%chatbot.global_enabled%'
            'array $modules': '%modules%'

    _instanceof:
        App\Service\Delivery\Connector\DeliveryProviderInterface:
            tags: ['app.delivery.connector']

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\Workflow\Transition\:
        resource: '../src/Service/Workflow/Transition/'
        tags: ['app.workflow.transition']

    App\Service\ImageService:
        arguments:
            $uploadDir: '%app.chat.upload_dir%'

    App\Service\MediaService:
        arguments:
            $uploadDir: '%app.chat.upload_dir%'
            $publicDir: '%kernel.project_dir%/public'

    App\Service\AppConfigService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Boutique\SubdomainResolver:
        arguments:
            $rootDomain: '%env(ROOT_DOMAIN)%'

    App\Service\Boutique\ShopContext:
        arguments:
            $rootDomain: '%env(ROOT_DOMAIN)%'

    App\Service\Boutique\ReservedSlugRegistry:
        arguments:
            $additional: '%app.reserved_slugs%'

    App\Service\Auth\KeycloakRedirectUriSynchronizer:
        arguments:
            $adminUrl: '%env(KEYCLOAK_ADMIN_URL)%'
            $realm: '%env(KEYCLOAK_REALM)%'
            $clientId: '%env(KEYCLOAK_CLIENT_ID)%'
            $adminUsername: '%env(KEYCLOAK_ADMIN_USERNAME)%'
            $adminPassword: '%env(KEYCLOAK_ADMIN_PASSWORD)%'
            $rootDomain: '%env(ROOT_DOMAIN)%'
            $publicScheme: '%env(KEYCLOAK_PUBLIC_SCHEME)%'
            $publicPort: '%env(KEYCLOAK_PUBLIC_PORT)%'
            $enabled: '%env(bool:KEYCLOAK_REDIRECT_SYNC_ENABLED)%'

    App\Factory\RedisFactory:
        arguments:
            $password: '%env(default::REDIS_PASSWORD)%'

    App\Command\MediaCleanupCommand:
        arguments:
            $uploadDir: '%app.chat.upload_dir%'

    App\Service\Delivery\EncryptionService:
        arguments:
            $appSecret: '%kernel.secret%'

    App\State\Chat\MessageProcessor:
        arguments:
            $uploadDir: '%app.chat.upload_dir%'

    App\State\Common\FrontendBootstrapProvider:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Config\CacheConfig:
        arguments:
            $cacheTtl: '%cache_ttl%'
