services:
  app:
    image: market-shop-app:local
    build:
      context: .
      dockerfile: etc/docker/frankenphp/Dockerfile
      pull: true
    labels:
      - traefik.enable=true
      - traefik.http.routers.market-shop.rule=Host(`market-shop.localhost`)
      - traefik.http.routers.market-shop.entrypoints=web
      - traefik.http.services.market-shop.loadbalancer.server.port=80
    ports:
      - "8082:80"
    volumes:
      - .:/app
      - caddy_data:/data
      - caddy_config:/config
    working_dir: /app
    extra_hosts:
      - "auth.localhost:host-gateway"
    environment:
      SERVER_NAME: :80
      APP_RUNTIME: Symfony\Component\Runtime\SymfonyRuntime
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: http://localhost:3000/.well-known/mercure
      MERCURE_JWT_SECRET: '79b233952d6af379df47b621384981190e2d1f6d56d34714e7467aa1fec72897'
    depends_on:
      - database
      - redis
      - supervisor
      - keycloak

  supervisor:
    image: market-shop-app:local
    build:
      context: .
      dockerfile: etc/docker/frankenphp/Dockerfile
    entrypoint: ["supervisord", "-c", "/etc/supervisor/supervisord.conf"]
    restart: unless-stopped
    healthcheck:
      disable: true
    volumes:
      - .:/app
    working_dir: /app
    environment:
      APP_RUNTIME: Symfony\Component\Runtime\SymfonyRuntime
    depends_on:
      - database
      - redis

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
      - ./etc/docker/postgres/init:/docker-entrypoint-initdb.d:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database:5432/app?currentSchema=keycloak
      KC_DB_USERNAME: app
      KC_DB_PASSWORD: app
      KC_DB_SCHEMA: keycloak
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: http://auth.localhost:8082
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    env_file:
      - .env.local
    volumes:
      - ./etc/keycloak/realm-dev.json:/opt/keycloak/data/import/realm-dev.json:ro
      - ./etc/keycloak:/opt/keycloak/config:ro
    depends_on:
      database:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  traefik:
    image: traefik:v3.1
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "8083:80"
      - "8084:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - app

###> symfony/mercure-bundle ###
  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      SERVER_NAME: ':80'
      # Uncomment the following line to disable HTTPS,
      #SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: '79b233952d6af379df47b621384981190e2d1f6d56d34714e7467aa1fec72897'
      MERCURE_SUBSCRIBER_JWT_KEY: '79b233952d6af379df47b621384981190e2d1f6d56d34714e7467aa1fec72897'
      # Set the URL of your Symfony project (without trailing slash!) as value of the cors_origins directive
      MERCURE_EXTRA_DIRECTIVES: |
        # Authenticated EventSource requests cannot use a wildcard CORS origin.
        cors_origins http://localhost:8082 http://market-shop.localhost:8082 http://demo-hanooti.localhost:8082
    # Comment the following line to disable the development mode
    command: /usr/bin/caddy run --config /etc/caddy/dev.Caddyfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - mercure_data:/data
      - mercure_config:/config
###< symfony/mercure-bundle ###

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3 && ollama pull llama3.2:1b && wait"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  database_data:
  caddy_data:
  caddy_config:

###> symfony/mercure-bundle ###
  mercure_data:
  mercure_config:
###< symfony/mercure-bundle ###
  ollama_data:
