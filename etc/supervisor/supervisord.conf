[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/var/run/supervisord.pid
user=root

[program:messenger-high]
command=php /app/bin/console messenger:consume async_high --time-limit=3600 --memory-limit=256M --failure-limit=3
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=APP_ENV="dev",APP_DEBUG="1"

[program:messenger-webhook]
command=php /app/bin/console messenger:consume async_webhook --time-limit=3600 --memory-limit=256M --failure-limit=3
