services:
  app:
    image: market-shop-app:${APP_VERSION:-production}
    build:
      context: .
      dockerfile: etc/docker/frankenphp/Dockerfile.prod
      args:
        MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:?MERCURE_PUBLIC_URL must be set}
        KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-https://auth.hanooti.shop}
        KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-hanooti-web}
    env_file:
      - ${PROD_ENV_FILE:-.env.prod}
    environment:
      SERVER_NAME: hanooti.shop, *.hanooti.shop
      APP_RUNTIME: Symfony\Component\Runtime\SymfonyRuntime
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: https://hanooti.shop/.well-known/mercure
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - uploads_data:/app/public/uploads
      - app_data:/app/var/data
      - ./secrets/certs:/run/caddy/certs:ro
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mercure:
        condition: service_healthy
      supervisor:
        condition: service_started
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.5
    networks:
      - edge
      - backend

  supervisor:
    image: market-shop-app:${APP_VERSION:-production}
    build:
      context: .
      dockerfile: etc/docker/frankenphp/Dockerfile.prod
      args:
        MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:?MERCURE_PUBLIC_URL must be set}
        KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-https://auth.hanooti.shop}
        KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-hanooti-web}
    env_file:
      - ${PROD_ENV_FILE:-.env.prod}
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_RUNTIME: Symfony\Component\Runtime\SymfonyRuntime
      CONTAINER_ROLE: supervisor
    healthcheck:
      disable: true
    volumes:
      - uploads_data:/app/public/uploads
      - app_data:/app/var/data
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 2.0
    networks:
      - backend

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    networks:
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.2
    command: start --optimized
    env_file:
      - ${PROD_ENV_FILE:-.env.prod}
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${POSTGRES_HOST:-database}:5432/${POSTGRES_DB}?currentSchema=keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER must be set}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      KC_DB_SCHEMA: keycloak
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-auth.hanooti.shop}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-keycloak-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-keycloak-admin}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.75
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - ${PROD_ENV_FILE:-.env.prod}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    networks:
      - backend

  mercure:
    image: dunglas/mercure:v0.19
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:?MERCURE_JWT_SECRET must be set}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:?MERCURE_JWT_SECRET must be set}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins https://hanooti.shop https://*.hanooti.shop
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - mercure_data:/data
      - mercure_config:/config
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    networks:
      - backend

  ollama:
    image: ollama/ollama:0.9.6
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-2}
    command: ["/bin/sh", "-c", "ollama serve & pid=$$!; until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull \"$${OLLAMA_MODEL}\"; wait $$pid"]
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    mem_limit: 1792m
    cpus: 1.0
    networks:
      - backend

volumes:
  database_data:
  redis_data:
  caddy_data:
  caddy_config:
  mercure_data:
  mercure_config:
  uploads_data:
  app_data:
  ollama_data:

networks:
  edge:
  backend:
    internal: true
